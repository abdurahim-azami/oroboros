name: Deploy site to GitHub Pages

# Publishes the static site/ folder after every push to main and after every successful
# nightly run, so the live site always shows last night's signals.
on:
  push:
    branches: [main]
  workflow_run:                # the nightly bot's commit can't trigger a push event, so chain on it
    workflows: ["Nightly signals"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # include the snapshot the nightly run just committed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/engine.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
