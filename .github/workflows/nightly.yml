name: Nightly signals

# Every night: fetch arXiv, HN, GitHub and job-board signals, write a dated snapshot to
# data/snapshots/, recompute momentum (live + replay), link-check courses, commit.
on:
  schedule:
    - cron: "17 18 * * *"      # 02:17 Malaysia time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-signals
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Fetch signals and rebuild momentum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/run_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine tests on the new snapshot
        run: node --test tests/engine.test.js
      - name: Commit snapshot
        run: |
          git config user.name "oroboros-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots site/data/momentum.json site/data/replay site/data/courses.json
          git diff --cached --quiet || git commit -m "Nightly snapshot $(date -u +%Y-%m-%d)"
          git push
